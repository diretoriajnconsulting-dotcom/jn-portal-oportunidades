name: Radar Diário de Oportunidades TransfereGov

on:
  schedule:
    # Executa todos os dias às 12:30 UTC (09:30 em João Pessoa / UTC-3)
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install duckdb pandas

      - name: Executar Varredura e Análise de Oportunidades
        run: |
          python scripts/radar.py --uf PB

      - name: Salvar e Publicar Dados Atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada nos dados do radar hoje."
          else
            git commit -m "chore(radar): atualiza oportunidades do transferegov [skip ci]"
            git push
          fi
